[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect API calls to the Render backend server seamlessly
[[redirects]]
  from = "/api/*"
  to = "https://thetrioshopp.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback redirect for React client router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
